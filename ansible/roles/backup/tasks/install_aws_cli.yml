- name: Install unzip
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Check whether AWS CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/aws
    follow: true
  register: aws_cli_binary

- name: Install AWS CLI v2 when missing
  when: not aws_cli_binary.stat.exists
  block:
    - name: Create the installer directory
      ansible.builtin.file:
        path: /var/tmp/container-app-awscli
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Download the official AWS CLI installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /var/tmp/container-app-awscli/awscliv2.zip
        mode: '0600'
        force: false

    - name: Extract the installer
      ansible.builtin.unarchive:
        src: /var/tmp/container-app-awscli/awscliv2.zip
        dest: /var/tmp/container-app-awscli
        remote_src: true
        creates: /var/tmp/container-app-awscli/aws/install

    - name: Install AWS CLI
      ansible.builtin.command:
        argv:
          - /var/tmp/container-app-awscli/aws/install
          - --install-dir
          - /usr/local/aws-cli
          - --bin-dir
          - /usr/local/bin
        creates: /usr/local/bin/aws

    - name: Remove the installer files
      ansible.builtin.file:
        path: /var/tmp/container-app-awscli
        state: absent
