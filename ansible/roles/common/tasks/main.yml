- name: Verify the server operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "This project expects Ubuntu 24.04 amd64 servers."

- name: Install base utilities
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - cron
      - logrotate
      - util-linux
      - python3
      - python3-apt
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Start and enable cron
  ansible.builtin.service:
    name: cron
    state: started
    enabled: true

- name: Configure SSH authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-container-project.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
